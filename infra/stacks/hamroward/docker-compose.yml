name: hamroward

# Hamro Ward: one API image in three roles (web, queue, scheduler), its own Redis,
# and the Next.js server that also serves the staff dashboard on the admin host.
#
# The database is the shared PostgreSQL in ~/stacks/postgres (central database
# "hamroward" plus one hw_t_* database per municipality), reached over the "db"
# network. Only "app" and "web" join the public-facing "web" network, and nothing
# publishes a port: the proxy forwards to the container names.
#
# The provisioner role's password is deliberately NOT in this stack's
# environment; creating a municipality is a one-off command (see PHASE-4.md).

x-api: &api
  image: ${HAMROWARD_API_IMAGE}
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - hamroward_storage:/var/www/html/storage
  networks:
    - backend
    - db

services:
  app:
    <<: *api
    container_name: hamroward-app
    environment:
      # Startup automation from the base image, plus our migrations hook.
      # The base image's own migration step is off: central migrations run as the
      # schema owner in docker/entrypoint.d/90-hamroward-migrations.sh.
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "false"
      HEALTHCHECK_PATH: "/up"
      PHP_OPCACHE_ENABLE: "1"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - db
      - web

  queue:
    <<: *api
    container_name: hamroward-queue
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--max-time=3600"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
      PHP_OPCACHE_ENABLE: "1"
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s
    depends_on:
      app:
        condition: service_started

  scheduler:
    <<: *api
    container_name: hamroward-scheduler
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
      PHP_OPCACHE_ENABLE: "1"
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    depends_on:
      app:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: hamroward-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hamroward_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  web:
    image: ${HAMROWARD_WEB_IMAGE}
    container_name: hamroward-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
    networks:
      - web

volumes:
  hamroward_storage:
    name: hamroward_storage
  hamroward_redis:
    name: hamroward_redis

networks:
  backend:
    name: hamroward_backend
  db:
    external: true
  web:
    external: true
