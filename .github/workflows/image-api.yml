name: api image

# Builds the API image for the server (arm64) and pushes it to GHCR.
# Tests run in the "api" workflow on the same commit; check both are green before
# deploying.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/image-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hamro-ward-api

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Verify the image
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest" | tee /tmp/api.txt
          grep -q "linux/arm64" /tmp/api.txt
