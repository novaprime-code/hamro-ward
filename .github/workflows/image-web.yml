name: web image

# Builds the site image for the server (arm64) and pushes it to GHCR.
#
# NEXT_PUBLIC_* values and the internal API URL are baked in at build time, so
# changing any of them means re-running this workflow and then redeploying.
# Set them as repository variables: Settings -> Secrets and variables -> Actions -> Variables.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/image-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-web-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hamro-ward-web

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ADMIN_HOST=${{ vars.NEXT_PUBLIC_ADMIN_HOST }}
            API_INTERNAL_URL=${{ vars.API_INTERNAL_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify the image
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest" | tee /tmp/web.txt
          grep -q "linux/arm64" /tmp/web.txt
