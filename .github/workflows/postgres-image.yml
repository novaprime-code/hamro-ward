name: postgres image

# Builds the shared PostgreSQL image (pgvector + PostGIS) for both architectures
# and publishes it to GHCR. Runs on changes to the image, monthly to pick up base
# image and security updates, and on demand.

on:
  push:
    branches: [main]
    paths:
      - "infra/postgres-image/**"
      - ".github/workflows/postgres-image.yml"
  schedule:
    # 04:10 UTC on the first of the month
    - cron: "10 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: postgres-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hamro-ward-postgres

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: infra/postgres-image
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=postgres-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=postgres-${{ matrix.arch }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish multi-architecture tags
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the tags
        id: tags
        run: |
          DATE_TAG="pg17-$(date -u +%Y%m%d)"
          SHA_TAG="pg17-sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "date_tag=$DATE_TAG" >> "$GITHUB_OUTPUT"

          # "pg17" moves; "pg17-<date>" and "pg17-sha-<commit>" are pinnable —
          # the server pins a dated tag so a rebuild never restarts the database
          # by surprise.
          docker buildx imagetools create \
            --tag "${IMAGE}:pg17" \
            --tag "${IMAGE}:${DATE_TAG}" \
            --tag "${IMAGE}:${SHA_TAG}" \
            $(printf "${IMAGE}@sha256:%s " $(ls /tmp/digests))

      - name: Verify both architectures are present
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.date_tag }}" \
            | tee /tmp/inspect.txt
          grep -q "linux/amd64" /tmp/inspect.txt
          grep -q "linux/arm64" /tmp/inspect.txt
          echo "Pin this on the server: ${IMAGE}:${{ steps.tags.outputs.date_tag }}"
