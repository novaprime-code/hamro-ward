name: Staging images

# Push to `staging` → build both images, tag them, redeploy the staging stack.
#
# Every build produces an immutable `sha-<commit>` tag plus the moving
# `staging` tag the Portainer stack points at. The sha tag is what makes
# promotion possible later: when this commit reaches main by a fast-forward
# merge, the production workflow re-tags THIS image rather than building a
# second one from the same source (docs/DECISIONS D-015).

on:
  push:
    branches: [staging]
    paths-ignore:
      - 'docs/**'
      - 'design-v2/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: images-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.app }}
    # arm64 native: the Oracle A1 is aarch64, and cross-building PHP
    # extensions under QEMU takes roughly ten times as long.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: .
            dockerfile: apps/api/Dockerfile
          - app: web
            context: .
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # No build args. Both images are environment-agnostic on purpose:
          # an image that knows its own hostname cannot be promoted (D-015).
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:staging
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          provenance: false

  deploy:
    name: Redeploy staging
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_STAGING }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "PORTAINER_WEBHOOK_STAGING is not set — images are pushed, deploy by hand."
            exit 0
          fi

          # Portainer re-pulls whatever tag the stack references (:staging) and
          # recreates the containers. A non-2xx is a real failure: the images
          # are in the registry but the server is still on the old ones.
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST "${WEBHOOK}")
          echo "Portainer responded ${code}"
          cat /tmp/out || true
          [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]

      - name: Summary
        run: |
          {
            echo "### Staging"
            echo
            echo '`sha-${{ github.sha }}` is live on staging.'
            echo
            echo 'To promote: fast-forward `main` to this commit and push.'
          } >> "$GITHUB_STEP_SUMMARY"
